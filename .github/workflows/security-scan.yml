name: Security Scan

# Runs the AI Security Scanner on every push / PR:
#  - code (Semgrep), dependencies (OSV.dev) and hardcoded secrets
#  - results appear in the repo's Security -> Code scanning tab and as PR annotations
#  - the job fails when findings at or above FAIL_ON exist (blocks the PR if the
#    check is marked "required" in branch protection)
#
# To use it in another repository, copy this file there and change the
# "Get scanner" step to check out this scanner's repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning

env:
  FAIL_ON: critical          # none | low | medium | high | critical

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep (isolated, avoids dependency conflicts with the scanner)
        run: pipx install semgrep

      - name: Install scanner dependencies
        run: pip install -r backend/requirements.txt

      - name: Run scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional: AI explanations
        run: >
          python backend/cli.py scan .
          --sarif results.sarif
          --json results.json
          --pdf security-report.pdf
          --fail-on "$FAIL_ON"
          ${{ secrets.GROQ_API_KEY == '' && '--no-ai' || '' }}

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: ai-security-scanner

      - name: Keep full reports (PDF + JSON)
        if: always() && hashFiles('results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            security-report.pdf
            results.json
